[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "docling-lightonocr"
version = "0.1.0"
description = "Docling OCR plugin for LightOnOCR-2-1B-bbox-soup via an OpenAI-compatible API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "docling>=2.28.0",
    "docling-core>=2.0.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpserver>=1.0",
    "responses>=0.25",
]

# ── Docling plugin entry-point ────────────────────────────────────────────────
# Docling's pluggy loader discovers this entry-point at runtime and calls
# docling_lightonocr.plugin:ocr_engines() to register the engine class.
[project.entry-points."docling"]
lightonocr = "docling_lightonocr.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["docling_lightonocr*"]
